<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>宇部市 公衆トイレマップ</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body {
  margin: 0;
  font-family: sans-serif;
}

h1 {
  margin: 16px;
  font-size: 1.4rem;
}

#map {
  height: calc(100vh - 70px);
}
</style>
</head>

<body>

<h1>宇部市 公衆トイレマップ 🚻</h1>

<div id="map"></div>

<script>

const map = L.map('map').setView([33.95, 131.25], 13);

L.tileLayer(
  'https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png',
  {
    attribution: '国土地理院'
  }
).addTo(map);


fetch('./mapdata.geojson')
  .then(r => r.json())
  .then(data => {

    const layer = L.geoJSON(data, {

      // -----------------------------
      // ピンの表示
      // -----------------------------
      pointToLayer: (feature, latlng) => {

        const p = feature.properties || {};

        // 利用可能時間を確認
        const hours = p['利用可能時間特記事項'] || '';

        // 「24時間」を含んでいれば緑
        const is24hours = String(hours).includes('24時間');

        return L.circleMarker(latlng, {
          radius: 8,
          color: is24hours ? 'green' : '#3388ff',
          fillColor: is24hours ? 'green' : '#3388ff',
          fillOpacity: 0.8
        });
      },


      // -----------------------------
      // ポップアップ
      // -----------------------------
      onEachFeature: (feature, marker) => {

        const p = feature.properties || {};
        const lines = [];

        if (p.name) {
          lines.push(`<strong>${p.name}</strong>`);
        }

        if (p.address) {
          lines.push(`📍 住所：${p.address}`);
        }

        if (p['設置位置']) {
          lines.push(`設置位置：${p['設置位置']}`);
        }

        if (p['利用可能時間特記事項']) {
          lines.push(`🕐 利用時間：${p['利用可能時間特記事項']}`);
        }

        if (p['車椅子使用者用トイレ有無']) {
          lines.push(`♿ 車椅子対応：${p['車椅子使用者用トイレ有無']}`);
        }

        if (p['乳幼児用設備設置トイレ有無']) {
          lines.push(`👶 乳幼児設備：${p['乳幼児用設備設置トイレ有無']}`);
        }

        if (p['オストメイト設置トイレ有無']) {
          lines.push(`オストメイト設備：${p['オストメイト設置トイレ有無']}`);
        }

        marker.bindPopup(lines.join('<br>'));
      }

    }).addTo(map);


    // 全てのピンが見える範囲に自動調整
    if (layer.getBounds().isValid()) {
      map.fitBounds(
        layer.getBounds(),
        { padding: [20, 20] }
      );
    }

  });

</script>

</body>
</html>
